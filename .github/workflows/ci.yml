name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    # for the tests of code that needs a database, which a plain `cargo test` ignores
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      # pinned to the version used locally, the code uses Rust 2024 features
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      # caches the cargo registry and target directory between runs
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # the tests use saved API responses, so they need neither network access
      # nor the .env variables. --include-ignored also runs the database tests,
      # each in its own database on the MongoDB service above
      - name: Test
        run: cargo test -- --include-ignored
        env:
          TEST_DATABASE_URL: mongodb://127.0.0.1:27017
