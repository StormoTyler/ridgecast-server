name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pinned to the version used locally, the code uses Rust 2024 features
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy

      # caches the cargo registry and target directory between runs
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # the tests use saved API responses, so they need neither MongoDB,
      # network access, nor the .env variables
      - name: Test
        run: cargo test
