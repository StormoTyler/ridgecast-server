[package]
name = "TrailAlert"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
axum = "0.8.9"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
thiserror = { version = "2.0.18" }
geojson = "1.0.0"
geo = { version = "0.32.0", features = ["serde"] }
mongodb = "3.8.0"
once_cell = "1.21.4"
geo-types = "0.7.20"
futures = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }

