[package]
name = "ridgecast"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
axum = "0.8.9"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
thiserror = { version = "2.0.18" }
geojson = "1.0.0"
geo = { version = "0.32.0", features = ["serde"] }
mongodb = "3.8.0"
# same bson version mongodb uses, with chrono support for storing dates
bson = { version = "2.15", features = ["chrono-0_4"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15"
async-trait = "0.1.92"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
# sms::user_numbers stores an HMAC-SHA256 of each number rather than the number
hmac = "0.12"
sha2 = "0.10"


[dev-dependencies]
# pausing time in tests, so the send retry delays run instantly
tokio = { version = "1.52.3", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
